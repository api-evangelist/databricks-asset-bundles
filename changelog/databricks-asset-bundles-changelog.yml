entries:
  - version: CLI 1.3.0
    date: '2026-06-10'
    type: addition
    highlight: >-
      Genie Agents (formerly Genie Spaces) can now be defined in Declarative
      Automation Bundles configuration.
  - version: CLI 1.3.0
    date: '2026-06-10'
    type: status-change
    breaking: true
    highlight: >-
      The direct deployment engine is generally available. New bundles created
      with CLI 1.3.0 and above use it by default instead of the Terraform
      deployment engine.
  - version: CLI 1.2.0
    date: '2026-06-04'
    type: addition
    highlight: >-
      `databricks bundle plan` and `databricks bundle deploy` gain `--select`,
      to plan or deploy only the specified resource(s).
  - version: CLI 1.1.0
    date: '2026-05-27'
    type: addition
    highlight: >-
      Vector search endpoints and indexes can now be defined in bundle
      configuration.
  - version: null
    date: '2026-04-29'
    type: addition
    highlight: >-
      Custom bundle templates can be made available to users developing bundles
      in the workspace.
  - version: null
    date: '2026-03-16'
    type: rename
    breaking: false
    highlight: >-
      Databricks Asset Bundles renamed to Declarative Automation Bundles.
  - version: CLI 0.287.0
    date: '2026-02-05'
    type: addition
    highlight: >-
      Lakebase Postgres projects, branches, and compute endpoints can be
      defined in bundle configuration.
  - version: CLI 0.279.0
    date: '2025-12-04'
    type: addition
    highlight: >-
      New `databricks bundle migrate` command to migrate bundles onto the direct
      deployment engine, ahead of it becoming the default.
